<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>UD5 - Eventos de teclado - keylog</title>

</head>

<body>
    <h1>Hola, estoy apuntando lo que escribes</h1>
    <form>
        <input type="text">
    </form>
    <script type="text/javascript">
        document.addEventListener("keypress", tecla);

        var sCadena = "";

        function tecla(oEvento) {
            var oE = oEvento || window.event;

            // sCadena += String.fromCharCode(oE.which);
            sCadena += oE.key;


            console.log(sCadena);

            if (/harry$/.test(sCadena)) {
                alert("Hola Harry");
            }
        }
    </script>
</body>

</html>
