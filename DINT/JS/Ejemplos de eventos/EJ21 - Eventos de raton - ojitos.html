<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>UD5 - Eventos de raton - paint</title>

    <style type="text/css">
        .ojo {
            position: fixed;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid black;
        }

        .pupila {
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid black;
            background-color: black;
        }
    </style>
</head>

<body>
    <div style="height: 1000px;">
        <div class="ojo" style="top:200px;left:300px">
            <div class="pupila" style="top:20px;left:20px"></div>
        </div>
        <div class="ojo" style="top:200px;left:500px">
            <div class="pupila" style="top:20px;left:20px"></div>
        </div>
    </div>
    <script type="text/javascript">

        document.body.addEventListener("mousemove", movimientoOcular);
        document.body.style.width = screen.width;
        document.body.style.height = screen.height;

        function movimientoOcular(oEvento) {
            let oE = oEvento || window.event;

            let posX = (oE.clientX / screen.width) * 100;
            let posY = (oE.clientY / screen.height) * 100;
            console.log("oE.clientX:" + oE.clientX);
            console.log("oE.clientY:" + oE.clientY);
            console.log("screen.width:" + screen.width + " screen.height:" + screen.height);

            let oPupilas = document.querySelectorAll(".pupila");

            for (let oPupila of oPupilas) {
                oPupila.style.left = posX + "px";
                oPupila.style.top = posY + "px";
            }

        }



    </script>
</body>

</html>
