<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>UD 5 - Cancelar envio formulario</title>
</head>

<body>
    <form method="get" action="destino.html" name="formu">

        <input type="text" name="txtTexto">
        <input type="submit" value="Aceptar" name="btnAceptar">
    </form>

    <script type="application/javascript">
        // Metodo 1 - Capturando click del boton submit
        // formu.btnAceptar.addEventListener("click", manejador, false);


        //Metodo 2 - Capturando evento submit
        formu.addEventListener("submit", manejador, false);


        function manejador(oEvento) {

            var oE = oEvento || window.event;

            // Ejemplo de validación
            if (formu.txtTexto.value.length == 0){ 
            //Cancelas el submit
                oE.preventDefault();
                alert("Debes rellenar el campo");
            }

        }
    </script>
</body>

</html>
