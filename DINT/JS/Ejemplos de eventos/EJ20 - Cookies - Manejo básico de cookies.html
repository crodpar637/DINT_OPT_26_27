<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
<title>EJ20 - Cookies - Manejo básico</title>
<script type="text/javascript">

// Sirve para establecer o modificar el valor de una cookie
function setCookie(cname, cvalue, exdays) { // cookie name, cookie value, dias de validez
    var d = new Date();
    
    d.setTime(d.getTime() + (exdays*24*60*60*1000));
    
    var expires = "expires="+d.toUTCString();
    
    document.cookie = cname + "=" + cvalue + "; " + expires;  // Aqui es donde se escribe la cookie
    
}

//Sirve para recuperar el valor almacenado para una cookie
function getCookie(cname) { // cookie name
    var name = cname + "=";
    var ca = document.cookie.split(';'); // Splitea los pares key (clave) / value (valor) name1=valor1;name2=valor2
    for(var i=0; i<ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0)==' ') c = c.substring(1);
        if (c.indexOf(name) != -1) return c.substring(name.length, c.length);
    }
    return "";
}

// Sirve para borrar una cookie
function deleteCookie(cname) { // cookie name
      
    document.cookie = cname + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC";  // Así es como se borra una cookie
    
}


function checkCookie() {
    var user = getCookie("username");
    if (user != "") {
        alert("Welcome again " + user);
    } else {
        user = prompt("Please enter your name:", "");
        if (user != "" && user != null) {
            setCookie("username", user, 365);
        }
    }
}

window.addEventListener("load",inicio,false);

function inicio(){
	//Agregar manejadores de evento
	document.formu.btnGuardar.addEventListener("click",guardar,false);
	document.formu.btnRecuperar.addEventListener("click",recuperar,false);
}

function guardar(){
	
	//Se guarda la cookie
	setCookie(document.formu.txtClave.value,document.formu.txtValor.value,30);
	
	//Reset del formulario
	document.formu.reset();

}

function recuperar(){
	//Se recupera la cookie
	var sValor = getCookie(document.formu.txtClave.value);
	
	alert(sValor);
	
	//Reset del formulario
	document.formu.reset();


}
</script>

</head>

<body>
	<form name="formu">
		Clave:
		<input type="text" name="txtClave"></input> <br/>
		Valor:
		<input type="text" name="txtValor"></input>  <br/>
		<input type="button" name="btnGuardar" value="Guardar"></input>
		<input type="button"  name="btnRecuperar" value="Recuperar"></input>
	</form>	
</body>

</html>
